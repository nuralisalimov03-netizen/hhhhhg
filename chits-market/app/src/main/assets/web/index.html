<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1211">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https: http:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Chits Market</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="svg-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-market" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><path d="M14 17.5h7M17.5 14v7"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-assistant" viewBox="0 0 24 24"><path d="m12 2 2.7 6.9L22 12l-7.3 3.1L12 22l-2.7-6.9L2 12l7.3-3.1L12 2Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3"/><circle cx="15" cy="17" r="3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 12H4m6-6-6 6 6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6Z"/><path d="m8 12 3 3 5-6"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V3m-4 4 4-4 4 4M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2 6M20 4v7h-7"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7m4-7v7"/></symbol>
  </defs></svg>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#catalog" aria-label="Chits Market — каталог"><span class="brand-symbol">c<svg aria-hidden="true"><use href="#i-arrow"/></svg></span><span>chits<span class="brand-secondary">market</span></span></a>
      <button class="connection-badge" id="connection-badge" data-action="settings"><i></i><span>Локальный режим</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <nav class="bottom-nav" aria-label="Разделы маркета">
      <button data-page="catalog" class="nav-item active" aria-current="page"><svg><use href="#i-market"/></svg><span>Маркет</span></button>
      <button data-page="downloads" class="nav-item"><svg><use href="#i-download"/></svg><span>Загрузки</span><i class="nav-counter" id="download-counter" hidden>0</i></button>
      <button data-page="assistant" class="nav-item"><svg><use href="#i-assistant"/></svg><span>Помощник</span></button>
      <button data-page="settings" class="nav-item"><svg><use href="#i-settings"/></svg><span>Настройки</span></button>
    </nav>
  </div>
  <dialog id="app-dialog" class="sheet"><div id="app-detail"></div></dialog>
  <dialog id="confirm-dialog" class="sheet confirm-sheet"><div class="sheet-top"><span class="eyebrow">ПОДТВЕРЖДЕНИЕ</span><button class="icon-button" data-action="close-confirm" aria-label="Закрыть"><svg><use href="#i-close"/></svg></button></div><h2 id="confirm-title"></h2><p id="confirm-text" class="muted"></p><div class="button-row"><button class="button secondary" data-action="close-confirm">Отмена</button><button class="button danger" id="confirm-button">Удалить</button></div></dialog>
  <div id="toast" role="status" class="toast" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
